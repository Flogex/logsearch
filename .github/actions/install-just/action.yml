name: Install just
description: >-
  Install an upstream `just` release binary, verified against a pinned SHA-256.

runs:
  using: composite
  steps:
    - name: Download, verify and install just
      shell: bash
      env:
        # Release tags carry no leading "v".
        # casey publishes digests on the GitHub releases page. Bump them together with the version.
        VERSION: "1.58.0"
        SHA256_X86_64: "4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d"
        SHA256_AARCH64: "748237128c4c40cbdabc65e841d05ceba13cc23a91eaba395495894c1d9764df"
        # Already on PATH.
        BIN_DIR: /usr/local/bin
      run: |
        set -euxo pipefail
        case "$(uname -m)" in
          x86_64)
            target=x86_64-unknown-linux-musl
            sha=${SHA256_X86_64}
            ;;
          aarch64)
            target=aarch64-unknown-linux-musl
            sha=${SHA256_AARCH64}
            ;;
          *)
            echo "Unsupported architecture: $(uname -m)" >&2
            exit 1
            ;;
        esac

        tmp=$(mktemp -d)
        archive="just-${VERSION}-${target}.tar.gz"
        "${GITHUB_WORKSPACE}/scripts/fetch_verified.sh" \
          "https://github.com/casey/just/releases/download/${VERSION}/${archive}" \
          "${sha}" \
          "${tmp}/${archive}"

        # Flat archive: The binary sits at the root next to the docs.
        tar -xzf "${tmp}/${archive}" -C "${tmp}" just
        sudo install -m 0755 "${tmp}/just" "${BIN_DIR}/just"
        rm -rf "${tmp}"

        "${BIN_DIR}/just" --version
