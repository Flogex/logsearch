name: ccache
description: >-
  Install ccache, restore its object cache, and export its configuration to the
  rest of the job.

inputs:
  key:
    description: >-
      Identifies the cache entry, typically the matrix cell. Entries are never
      shared between different values.
    required: true
  max-size:
    description: Upper bound on the object cache, and so on what each run uploads.
    required: false
    default: 500M
  cache-dir:
    description: >-
      Where ccache stores objects. Kept inside the workspace so it and
      CCACHE_BASEDIR agree on the paths ccache rewrites.
    required: false
    default: ${{ github.workspace }}/.ccache

runs:
  using: composite
  steps:
    - name: Install ccache
      shell: bash
      run: |
        set -euxo pipefail
        if ! command -v ccache >/dev/null; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache
        fi

    # A stable key would hit on restore, which suppresses the post-job save and
    # freezes the cache at its first contents. Unique-per-run key => always miss,
    # always save. restore-keys still pulls the newest previous entry.
    # hendrikmuhs/ccache-action does this with a timestamp embedded in the key instead,
    # but we have run_id/run_attempt already in context.
    # See also:
    # https://cristianadam.eu/20200113/speeding-up-c-plus-plus-github-actions-using-ccache/
    - name: Restore ccache
      uses: actions/cache@v6
      with:
        path: ${{ inputs.cache-dir }}
        key: ccache-${{ inputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ccache-${{ inputs.key }}-

    - name: Configure ccache
      shell: bash
      env:
        CCACHE_DIR: ${{ inputs.cache-dir }}
        CCACHE_MAXSIZE: ${{ inputs.max-size }}
        # Relative paths and hashing on compiler bytes keep hits reliable across
        # runners. time_macros lets ccache cache a translation unit that expands
        # __DATE__/__TIME__ instead of refusing to.
        CCACHE_BASEDIR: ${{ github.workspace }}
        CCACHE_COMPILERCHECK: content
        CCACHE_SLOPPINESS: time_macros
      run: |
        set -euxo pipefail
        mkdir -p "${CCACHE_DIR}"
        ccache --show-config
        ccache --zero-stats

        # A step's env reaches later steps only through the environment file.
        {
          echo "CCACHE_DIR=${CCACHE_DIR}"
          echo "CCACHE_MAXSIZE=${CCACHE_MAXSIZE}"
          echo "CCACHE_BASEDIR=${CCACHE_BASEDIR}"
          echo "CCACHE_COMPILERCHECK=${CCACHE_COMPILERCHECK}"
          echo "CCACHE_SLOPPINESS=${CCACHE_SLOPPINESS}"
        } >> "$GITHUB_ENV"
