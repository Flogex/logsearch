name: Benchmark

on:
  schedule:
    # daily at 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch: {}

concurrency:
  group: benchmark
  cancel-in-progress: false

env:
  AWS_DEFAULT_REGION: auto
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: System info
        run: |
          uname -a
          lscpu | head -20
          free -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: benchmark/requirements.txt

      - name: Install Python deps
        run: |
          pip install -r benchmark/requirements.txt
          pip install awscli

      - name: Prepare datasets (R2 cache → build on miss)
        # For each dataset listed by `prepare.py --list-datasets`:
        #   - if `s3://$R2_BUCKET/fixtures/<dataset>.parquet` exists, download it.
        #   - otherwise build it locally and upload it back.
        # Cache is invalidated manually: when you change the schema in
        # `prepare.py`, delete the affected object(s) under fixtures/ in R2.
        run: |
          set -euo pipefail
          mkdir -p benchmark/data/prepared
          if [ -z "${R2_BUCKET:-}" ]; then
            echo "[no R2] building all datasets from origin"
            python benchmark/data/prepare.py
            exit 0
          fi
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          for ds in $(python benchmark/data/prepare.py --list-datasets); do
            local_parquet="benchmark/data/prepared/${ds}.parquet"
            remote="s3://${R2_BUCKET}/fixtures/${ds}.parquet"
            if aws s3 ls "$remote" --endpoint-url "$endpoint" >/dev/null 2>&1; then
              echo "[cache hit ] $ds"
              aws s3 cp "$remote" "$local_parquet" --endpoint-url "$endpoint"
            else
              echo "[cache miss] $ds — building from origin and uploading"
              python benchmark/data/prepare.py --dataset "$ds"
              aws s3 cp "$local_parquet" "$remote" --endpoint-url "$endpoint"
            fi
          done

      - name: Run benchmarks
        id: bench
        run: |
          run_dir=$(python benchmark/run.py)
          echo "run_dir=$run_dir" >> "$GITHUB_OUTPUT"
          echo "run_id=$(basename "$run_dir")" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (90-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.run_id }}
          path: ${{ steps.bench.outputs.run_dir }}
          retention-days: 90

      - name: Upload to R2
        if: env.R2_BUCKET != ''
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp --recursive \
              "${{ steps.bench.outputs.run_dir }}" \
              "s3://${R2_BUCKET}/results/${{ steps.bench.outputs.run_id }}/" \
              --endpoint-url "$endpoint"
