repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Check for trailing whitespaces
      - id: end-of-file-fixer
        name: Check for empty newline at end of files
      - id: check-shebang-scripts-are-executable
        name: Check that scripts with shebangs are executable
      - id: check-yaml
        name: Check that yaml files are valid
      - id: pretty-format-json
        name: Check that json files are pretty formatted
        args: [--autofix, --indent=2, --no-sort-keys]
      - id: detect-private-key
        name: Check for private keys
      - id: mixed-line-ending
        name: Check for mixed line endings
      - id: check-added-large-files
        name: Check for added large files
      - id: check-merge-conflict
        name: Check for merge conflict markers

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.4
    hooks:
      - id: clang-format
        types_or: [c++, c]

  - repo: https://github.com/BlankSpruce/gersemi
    rev: 0.26.0
    hooks:
      - id: gersemi

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.13.0
    hooks:
      - id: markdownlint-cli2
        name: Lint Markdown files
        args: [--fix]

  - repo: local
    hooks:
      - id: require-pragma-once
        name: Require pragma once in .hpp headers
        entry: scripts/check-pragma-once.sh
        language: script
        files: \.hpp$

# Vendored verbatim from an upstream release; reformatting it would break hash verification.
exclude: ^cmake/CPM\.cmake$
